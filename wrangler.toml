# Cloudflare configuration for L++ Registry (registry.lplusplus.bond)
#
# The Worker is a read-only HTTP mirror. The canonical registry is git:
# `keel publish` writes index/blob files, commits, and pushes. Do not store
# packages, publisher tokens, or auth state in Worker memory.

name = "lplusplus-registry"
main = "registry-worker/index.ts"
compatibility_date = "2025-03-07"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ── Public configuration ──────────────────────────────────────────────────────
[vars]
DOMAIN = "lplusplus.bond"
REGISTRY_URL = "https://registry.lplusplus.bond"
STATIC_INDEX_URL = "https://lplusplus.bond/registry/index.json"
GITHUB_REPO = "samarnever-droid/llppregistry"

# Optional secrets/config:
#   wrangler secret put GITHUB_TOKEN     # higher GitHub API rate limits for /stats
#   BLOB_BASE_URL can be set later if blobs are mirrored over static HTTP.

# ── Custom Domain Route ───────────────────────────────────────────────────────
[[routes]]
pattern = "registry.lplusplus.bond/*"
zone_name = "lplusplus.bond"
