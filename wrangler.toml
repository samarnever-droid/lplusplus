# Cloudflare configuration for L++ Registry (registry.lplusplus.bond)
# Hosted on Cloudflare Workers + Supabase Backend

name = "lplusplus-registry"
main = "registry-worker/index.ts"
compatibility_date = "2025-03-07"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# ── Environment variables ─────────────────────────────────────────────────────
[vars]
DOMAIN = "lplusplus.bond"
REGISTRY_URL = "https://registry.lplusplus.bond"
SUPABASE_URL = "https://yarqrdhcmxhagxbbjrgu.supabase.co"
SUPABASE_KEY = "sb_publishable_j-3maSzjTD0jeojuYFCMvw_MGAYApAN"
CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsubHBsdXNwbHVzLmJvbmQk"

# ── Custom Domain Routes ──────────────────────────────────────────────────────
[[routes]]
pattern = "registry.lplusplus.bond/*"
zone_name = "lplusplus.bond"
