[package]
name = "keel"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# The core engine (content addressing, blob store, KV cache).
lpp-pm = { path = "../lpp-pm" }
# The modern command surface.
clap = { version = "4", features = ["derive"] }
# Table output.
tabled = "0.17"
# Safe, deterministic package archives (no system `tar` dependency).
flate2 = "1"
fs2 = "0.4"
tar = "0.4"
# Preserve user formatting/comments when editing manifests.
toml_edit = "0.22"

[dev-dependencies]
serde_json = "1"
