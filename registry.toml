# registry.toml
# Official L++ Package Registry — lplusplus.bond

[registry]
name = "L++ Package Registry"
version = "2.0"
url = "https://registry.lplusplus.bond"

[packages.sqlite]
git = "https://github.com/samarnever-droid/lplusplus.git"
path = "packages/sqlite"
version = "1.2.0"

[packages.lppsqlite]
git = "https://github.com/samarnever-droid/lplusplus.git"
path = "packages/lppsqlite"
version = "1.2.0"

[packages.lreact]
git = "https://github.com/samarnever-droid/lreact.git"
path = "src/lreact.lpp"
version = "1.0.0"

[packages.lpp-zip]
git = "https://github.com/samarnever-droid/lplusplus.git"
path = "packages/lpp-zip"
version = "0.1.0"

[packages.lpp-math]
git = "https://github.com/samarnever-droid/lplusplus.git"
path = "stdlib/math.lpp"
version = "0.1.0"

[packages.lppdb]
git = "https://github.com/samarnever-droid/lplusplus.git"
path = "packages/lppdb"
version = "2.1.0"
