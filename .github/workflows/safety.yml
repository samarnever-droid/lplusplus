name: Safety mission gate

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'runtime/**'
      - 'tests/**'
      - 'safety/**'
      - 'documentation/Safety_Mission.md'
      - 'README.md'
      - 'Doc.md'
      - 'wiki/**'
      - 'scripts/check_safety_mission.sh'
      - '.github/workflows/safety.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'runtime/**'
      - 'tests/**'
      - 'safety/**'
      - 'documentation/Safety_Mission.md'
      - 'README.md'
      - 'Doc.md'
      - 'wiki/**'
      - 'scripts/check_safety_mission.sh'

permissions:
  contents: read

jobs:
  claim-and-regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-01
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Validate safety contract and public claims
        run: sh scripts/check_safety_mission.sh
      - name: Run S1 deterministic rejection corpus
        run: sh scripts/run_s1_rejection.sh
