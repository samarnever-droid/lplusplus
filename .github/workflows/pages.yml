name: Deploy L++ website

on:
  push:
    branches: [master]
    paths:
      - "website/**"
      - "assets/**"
      - "install.ps1"
      - "install.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# This repository already uses a gh-pages branch. Deploying directly to that
# branch avoids the GitHub Pages environment protection rule that rejected the
# previous Actions-pages deployment from master.
permissions:
  contents: write

concurrency:
  group: gh-pages-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Sync root installers into site
        # The hosted installers at lplusplus.bond/install.ps1 and /install.sh
        # are served from website/public. Canonical sources live at the repo
        # root, so refresh them here on every deploy to prevent version drift
        # (the site previously served a stale copy pinned to v4.7.0).
        run: |
          cp install.ps1 website/public/install.ps1
          cp install.sh website/public/install.sh
      - name: Build website
        working-directory: website
        run: |
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: website/dist
          keep_files: false
