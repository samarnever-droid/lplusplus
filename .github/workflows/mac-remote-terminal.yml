name: Mac Build

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  mac-build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-01
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy

      - name: Build L++ toolchain on macOS
        run: |
          cargo build --release --locked --bin lpp --bin lpp-link

