name: Linux ARM64 Live Session

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  linux-arm64-verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install test dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc clang file binutils patchelf

      - name: Build lpp-link on ARM64 Linux
        run: |
          cargo build --release --bin lpp-link
          echo "=== lpp-link built on $(uname -m) ==="
          file target/release/lpp-link
          readelf -h target/release/lpp-link | grep Machine

      - name: Test ELF ARM64 object parsing + inspect
        run: |
          # Compile a simple ARM64 ELF object and verify lpp-link can inspect it
          cat > /tmp/add.c << 'EOF'
          int add(int a, int b) { return a + b; }
          EOF
          clang -c -o /tmp/add.o /tmp/add.c
          file /tmp/add.o
          readelf -h /tmp/add.o | grep -E "Machine|Class"
          ./target/release/lpp-link inspect /tmp/add.o
          echo "PASS: ELF ARM64 object inspection OK"

      - name: Test ELF ARM64 shared library (.so) build
        run: |
          # Build a shared library from ARM64 ELF object
          cat > /tmp/libadd.c << 'EOF'
          int add(int a, int b) { return a + b; }
          EOF
          clang -fPIC -c -o /tmp/libadd.o /tmp/libadd.c
          file /tmp/libadd.o

          ./target/release/lpp-link elf-arm64 --shared /tmp/libadd.o -o /tmp/libadd.so
          file /tmp/libadd.so
          readelf -h /tmp/libadd.so | grep -E "Machine|Class|Type"
          echo "PASS: ELF ARM64 shared library build OK"

      - name: Test ELF ARM64 dynamic linking + execution
        run: |
          cat > /tmp/main_dyn.c << 'EOF'
          int add(int a, int b);
          int main(void) { return add(20, 22); }
          EOF
          clang -c -o /tmp/main_dyn.o /tmp/main_dyn.c
          file /tmp/main_dyn.o

          # Link executable against our custom .so + libc
          ./target/release/lpp-link elf-arm64 /tmp/main_dyn.o -l /tmp/libadd.so -o /tmp/dyn_test
          file /tmp/dyn_test
          readelf -d /tmp/dyn_test | grep NEEDED || true

          # Patch rpath so dynamic linker finds /tmp/libadd.so
          patchelf --set-rpath /tmp /tmp/dyn_test
          /tmp/dyn_test || true
          EXIT=$?
          echo "Exit code: $EXIT"
          [ "$EXIT" -eq 42 ] && echo "PASS: ELF ARM64 dynamic link + execution OK" || (echo "FAIL: expected 42, got $EXIT" && exit 1)
