name: Native safety tools

on:
  push:
    branches: [master]
    paths:
      - 'lpp_runtime.c'
      - 'runtime/**'
      - 'tests/test_rust_network_adapter.sh'
      - '.github/workflows/safety-native.yml'
  pull_request:
    paths:
      - 'lpp_runtime.c'
      - 'runtime/**'
      - 'tests/test_rust_network_adapter.sh'
      - '.github/workflows/safety-native.yml'

permissions:
  contents: read

jobs:
  native-memory-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-01
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Install Valgrind Memcheck
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Execute the mandatory S0 tool baseline
        run: sh scripts/run_s0_safety.sh
