name: Deploy registry Worker

on:
  push:
    branches: [master]
    paths:
      - "registry-worker/**"
      - "wrangler.toml"
      - ".github/workflows/registry-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: registry-worker-deployment
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: registry-worker/package-lock.json
      - name: Install Worker dependencies
        working-directory: registry-worker
        run: npm ci
      - name: Type-check Worker
        working-directory: registry-worker
        run: npx tsc --noEmit
      - name: Deploy Worker to registry.lplusplus.bond
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare secrets are not configured; validation passed, deployment skipped."
            exit 0
          fi
          npx wrangler deploy
