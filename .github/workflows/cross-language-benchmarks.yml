name: Cross-language benchmark matrix

on:
  workflow_dispatch:
    inputs:
      repetitions:
        description: 'Measured executions per language/workload'
        required: false
        default: '5'
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  benchmark-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-09-01
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install optional language toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-full zig || true
      - name: Run correctness-first cross-language comparison
        run: python3 benchmarks/comparison/run.py --repetitions ${{ inputs.repetitions || '5' }} --warmups 1
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-language-benchmark-linux
          path: |
            benchmarks/comparison/latest.json
            benchmarks/comparison/latest.md
