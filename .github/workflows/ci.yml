name: L++ CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-and-lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Rust formatting
        run: cargo fmt --all -- --check

      - name: Clippy correctness and suspicious groups
        run: cargo clippy --workspace --all-targets --locked -- -A warnings -D clippy::correctness -D clippy::suspicious

  workspace-gates:
    name: Workspace Gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Configure git identity for tests
        run: |
          git config --global user.name "L++ CI"
          git config --global user.email "ci@lplusplus.bondd"

      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mold 2>/dev/null || echo "mold not available, continuing without it"

      - name: Workspace tests
        run: cargo test --workspace --locked

      - name: Build compiler and direct linker with all targets
        run: cargo build --release --locked --bin lpp --bin lpp-link --features all-arch

      - name: Strict runtime C compilation (Linux)
        if: runner.os == 'Linux'
        run: cc -std=c11 -Wall -Wextra -Werror -c lpp_runtime.c -o /tmp/lpp_runtime.o -pthread

      - name: Packaged runtime object linking
        if: runner.os == 'Linux'
        run: sh tests/test_packaged_runtime.sh

      - name: Direct ELF linker gates
        if: runner.os == 'Linux'
        run: |
          sh tests/test_lpp_link_elf.sh
          sh tests/test_lpp_link_negative.sh
          sh tests/test_direct_installed_build.sh
          sh tests/test_source_commands.sh

      - name: Target-triple support
        if: runner.os == 'Linux'
        run: sh tests/run_target_tests.sh

      - name: Direct Mach-O ARM64 linker gate (macOS)
        if: runner.os == 'macOS'
        run: sh tests/test_direct_macho_arm64.sh

  corpus-correctness-oracle:
    name: Corpus Correctness Oracle (196 Programs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build compiler and runtime
        run: |
          cargo build --bin lpp
          cargo build -p lpp-runtime

      - name: Run Corpus Type-Check Triage
        run: bash scripts/corpus_correctness.sh check

      - name: Run Full Corpus Correctness Oracle (Compile, Link & Run)
        run: bash scripts/corpus_correctness.sh run

  all-arch-check:
    name: Multi-Arch Cranelift Targets Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check all Cranelift target backends
        run: cargo check --locked --features all-arch

  wasm-backend-suite:
    name: WebAssembly (WASI) Backend Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install wasmtime (pinned v26.0.0)
        run: |
          WASMTIME_VERSION=26.0.0
          if [ "${{ runner.os }}" = "macOS" ]; then
            ARCH=$(uname -m)
            if [ "$ARCH" = "arm64" ]; then ARCH="aarch64"; fi
            curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-${ARCH}-macos.tar.xz" -o /tmp/wasmtime.tar.xz
          else
            curl -sSfL "https://github.com/bytecodealliance/wasmtime/releases/download/v${WASMTIME_VERSION}/wasmtime-v${WASMTIME_VERSION}-x86_64-linux.tar.xz" -o /tmp/wasmtime.tar.xz
          fi
          mkdir -p "$HOME/.wasmtime"
          tar -xJf /tmp/wasmtime.tar.xz -C "$HOME/.wasmtime" --strip-components=1
          echo "$HOME/.wasmtime" >> "$GITHUB_PATH"
          "$HOME/.wasmtime/wasmtime" --version

      - name: Rust WASM backend unit tests
        run: cargo test -p lpp-codegen-wasm --locked

      - name: Build release compiler
        run: cargo build --release --locked --bin lpp

      - name: Execute WebAssembly test suite
        run: sh tests/run_wasm_tests.sh

  windows-gates:
    name: Windows Gates & Direct Linker
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Configure git identity for tests
        run: |
          git config --global user.name "L++ CI"
          git config --global user.email "ci@lplusplus.bondd"

      - name: Core crates unit & gate tests
        run: |
          cargo test -p lpp-linker -p lpp-runtime -p lpp-driver -p lpp-types -p lpp-mir -p lpp-passes -p lpp-frontend -p lpp-common -p lpp-codegen-api -p lpp-codegen-cranelift -p lpp-codegen-wasm -p lpp-pm --locked

      - name: Build L++ toolchain & direct linker
        run: cargo build --release --locked --bin lpp --bin lpp-link

      - name: Direct PE Linker Verification
        run: |
          $env:PATH = "$PWD\target\release;$env:PATH"
          .\target\release\lpp.exe config set linker direct
          .\target\release\lpp.exe --version
          .\target\release\lpp-link.exe --version
          .\target\release\lpp.exe test/hello_world.lpp -o target/hello.exe
          .\target\hello.exe
